name: embed
on:
  workflow_dispatch:
    inputs:
      shards:
        description: shards
        required: true
permissions:
  contents: read
jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        s: ${{ fromJSON(inputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
      - uses: actions/cache@v4
        with:
          path: ~/fe
          key: model-e5-large
      - name: run
        env:
          FASTEMBED_CACHE_PATH: /home/runner/fe
        run: |
          pip install -q fastembed >/dev/null 2>&1
          mkdir -p out
          python3 embed.py d/${{ matrix.s }}.jsonl.gz out/${{ matrix.s }} 2>&1 | grep -E "кусков за"
      - uses: actions/upload-artifact@v4
        with:
          name: v-${{ matrix.s }}
          path: out
          retention-days: 3
