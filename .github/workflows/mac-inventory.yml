name: mac-inventory
on:
  workflow_dispatch:
    inputs:
      labels:
        description: 'JSON-список меток runs-on'
        # macos-14 снят: GitHub отвечает «configuration macos-14-arm64-us-default is not supported»
        default: '["macos-15","macos-26","macos-latest","macos-15-intel","macos-26-intel"]'
permissions:
  contents: read
concurrency:
  group: mac-inventory
  cancel-in-progress: false
jobs:
  inv:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.labels) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: inventory
        env:
          INV_LABEL: ${{ matrix.os }}
        run: |
          python3 scripts/mac-inventory.py > inv.json
          python3 - <<'PY'
          import json
          x = json.load(open("inv.json"))
          print("label:", x["label"], "image:", x["image_os"], x["image_version"])
          print("macOS:", x["macos"], x["macos_build"], x["arch"],
                "cpu:", x["ncpu"], "ram:", x["ram_gb"], "disk:", x["disk_total_gb"], "free:", x["disk_free_gb"])
          print("xcode default:", x["xcode_default_version"],
                [c["version"].replace("Xcode ", "") for c in x["xcodes"]])
          print("tools:", sum(1 for v in x["tools"].values() if v), "of", len(x["tools"]),
                "simulators:", len(x["simulators"]), "seconds:", x["collect_seconds"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: inv-${{ matrix.os }}
          path: inv.json
          if-no-files-found: error
          retention-days: 14
