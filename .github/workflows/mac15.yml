name: mac15
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ver:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - shell: bash
        run: |
          sw_vers; uname -m
          xcodebuild -version
          ls -d /Applications/Xcode*
          xcrun --show-sdk-version; swift --version 2>&1 | head -2
