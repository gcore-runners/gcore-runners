name: windows-rdp
# Временная Windows-машина с RDP: замерить задержку «как у настоящего ПК».
# Запуск (вручную, по слову владельца):
#   gh workflow run windows-rdp.yml -R gcore-runners/gcore-runners -f minutes=60 -f tunnel=bore
# Вход: mstsc → адрес из артефакта play-connect, пользователь rdp, пароль — секрет RDP_PASSWORD.
# tunnel=bore — без настроек (bore.pub); tunnel=tailscale требует секрет TS_AUTHKEY
# (ключ tailnet, reusable, ephemeral). Адрес не печатается в лог, а кладётся в connect.json.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Сколько держать машину, минут'
        default: '60'
      tunnel:
        description: 'bore (без настроек) или tailscale (нужен TS_AUTHKEY)'
        default: 'bore'
      os:
        description: 'Метка раннера: windows-2022 | windows-2025 | windows-11-arm'
        default: 'windows-2022'
permissions:
  contents: read
concurrency:
  group: windows-rdp
  cancel-in-progress: false
jobs:
  rdp:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 350
    steps:
      - name: Включить RDP и отдельного пользователя
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if (-not $env:RDP_PASSWORD) { throw 'секрет RDP_PASSWORD не задан' }
          # отдельный пользователь: вход под runneradmin выбил бы сессию, в которой идёт сам прогон
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          # туннель bore: вход с любого адреса, порт только 3389
          New-NetFirewallRule -Name rdp-bore -DisplayName 'RDP bore' -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow -Profile Any -ErrorAction SilentlyContinue | Out-Null
          # у интерфейса Tailscale профиль может быть «Public», и правило Remote Desktop тогда не действует:
          # открываем порт явно и только для адресов tailnet (100.64.0.0/10)
          New-NetFirewallRule -Name rdp-ts -DisplayName 'RDP tailnet' -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow -Profile Any -RemoteAddress 100.64.0.0/10 -ErrorAction SilentlyContinue | Out-Null
          $sec = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          if (Get-LocalUser -Name rdp -ErrorAction SilentlyContinue) { Set-LocalUser -Name rdp -Password $sec }
          else { New-LocalUser -Name rdp -Password $sec -PasswordNeverExpires | Out-Null }
          Add-LocalGroupMember -Group 'Administrators' -Member rdp -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member rdp -ErrorAction SilentlyContinue
          Write-Host 'RDP включён, пользователь rdp'
      - name: SSH-сервер
        shell: pwsh
        run: |
          # ssh по тому же адресу tailnet, что и mstsc; вход пользователем rdp с тем же паролем
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null
          Set-Service sshd -StartupType Automatic
          Start-Service sshd
          New-NetFirewallRule -Name sshd-in -DisplayName 'OpenSSH Server' -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22 -Profile Any -RemoteAddress 100.64.0.0/10 -ErrorAction SilentlyContinue | Out-Null
          New-NetFirewallRule -Name sshd-bore -DisplayName 'OpenSSH Server (bore)' -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22 -Profile Any -ErrorAction SilentlyContinue | Out-Null
          Write-Host 'SSH включён (порт 22 в tailnet)'
      - name: Tailscale
        if: inputs.tunnel == 'tailscale'
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          if (-not $env:TS_AUTHKEY) { throw 'секрет TS_AUTHKEY не задан' }
          $exe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $exe)) {
            Invoke-WebRequest 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' -OutFile "$env:RUNNER_TEMP\ts.exe"
            Start-Process "$env:RUNNER_TEMP\ts.exe" '/quiet' -Wait
          }
          & $exe up --authkey "$env:TS_AUTHKEY" --hostname gh-windows-rdp --accept-routes
          $ip = (& $exe ip -4 | Select-Object -First 1).Trim()
          if (-not $ip) { throw 'tailscale не выдал адрес' }
          @{ host = $ip; port = 3389 } | ConvertTo-Json -Compress |
            Set-Content -Path (Join-Path $env:RUNNER_TEMP 'tunnel.json') -Encoding utf8
          Write-Host 'Туннель готов; адрес — в артефакте play-connect'
      - name: bore-туннель
        if: inputs.tunnel == 'bore'
        shell: bash
        run: |
          python scripts/play_tunnel.py start --port 3389 --out "$RUNNER_TEMP/tunnel.json"
      - name: connect.json
        if: always()
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          LABEL: ${{ inputs.os }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'tunnel.json'
          if (-not (Test-Path $t)) { Write-Host 'туннель не поднялся: connect.json не пишем'; exit 0 }
          $j = Get-Content $t -Raw | ConvertFrom-Json
          python scripts/play_connect.py write --label $env:LABEL --method rdp --host $j.host --port $j.port --user rdp --password $env:RDP_PASSWORD --minutes $env:MINUTES --out out/connect.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play-connect
          path: out/connect.json
          retention-days: 1
          if-no-files-found: warn
      - name: Держать машину
        shell: pwsh
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          $m = 0
          [int]::TryParse($env:MINUTES, [ref]$m) | Out-Null
          if ($m -le 0) { $m = 90 }
          $until = (Get-Date).AddMinutes($m)
          Write-Host "Машина работает до $($until.ToString('HH:mm')) UTC; вход: rdp / секрет RDP_PASSWORD"
          while ((Get-Date) -lt $until) { Start-Sleep -Seconds 60 }
