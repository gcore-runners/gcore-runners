name: check
on:
  push:
    branches: ['job/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    # only the final runner-run commit; not the branch-creation push (its head_commit is main's)
    if: ${{ (github.event_name == 'push' && !github.event.created && startsWith(github.event.head_commit.message, 'job ')) || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: syntax and json
        run: |
          fail=0; n=0
          chk() { # kind cmd file
            if "${@:2}" >/dev/null 2>&1; then echo "PASS $1 ${@: -1}"; else echo "FAIL $1 ${@: -1}"; fail=1; fi
          }
          while IFS= read -r f; do
            n=$((n+1))
            case "$f" in
              *.json) chk json jq empty "$f"; continue ;;
              *.py)   chk py python3 -m py_compile "$f"; continue ;;
              *.sh)   chk bash bash -n "$f"; continue ;;
            esac
            first=$(head -n1 "$f" | head -c 80)
            case "$first" in
              '#!'*zsh*) if command -v zsh >/dev/null; then chk zsh zsh -n "$f"; else echo "SKIP zsh $f"; fi ;;
              '#!'*bash*|'#!'*[/\ ]sh|'#!'*[/\ ]sh\ *) chk bash bash -n "$f" ;;
              '#!'*python*) chk py python3 -m py_compile "$f" ;;
            esac
          done < <(git ls-files | grep -v '^\.github/')
          echo "checked $n files"
          exit $fail
