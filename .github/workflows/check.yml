name: check
on:
  push:
    branches: ['job/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: syntax and json
        run: |
          fail=0; n=0
          while IFS= read -r f; do
            n=$((n+1))
            case "$f" in
              *.json) jq empty "$f" 2>/dev/null && echo "PASS json $f" || { echo "FAIL json $f"; fail=1; } ;;
              *.py)   python3 -m py_compile "$f" 2>/dev/null && echo "PASS py $f" || { echo "FAIL py $f"; fail=1; } ;;
              *.sh)   bash -n "$f" 2>/dev/null && echo "PASS bash $f" || { echo "FAIL bash $f"; fail=1; } ;;
              *)      if head -c 64 "$f" | grep -qE '^#!.*(bash|/sh)'; then bash -n "$f" 2>/dev/null && echo "PASS bash $f" || { echo "FAIL bash $f"; fail=1; }; fi ;;
            esac
          done < <(git ls-files | grep -v '^\.github/')
          echo "checked $n files"
          exit $fail
